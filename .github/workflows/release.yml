name: 发布轻帧正式版
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有版本标签，例如 v1.0.0；补跑该标签的测试、构建和发布'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: 核对标签与版本
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r"versionName\s+['\"]([^'\"]+)['\"]",Path('app/build.gradle').read_text()).group(1)
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag) and tag=='v'+version, 'Tag/version mismatch'
          PY
      - name: 准备与验证
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          python scripts/prepare_ci.py
          python run-tests.py
      - name: 配置私有正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.LIGHTFRAME_RELEASE_KEYSTORE_BASE64 }}
          LINEAGE_BASE64: ${{ secrets.LIGHTFRAME_RELEASE_LINEAGE_BASE64 }}
        run: |
          python - <<'PY'
          import base64,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'lightframe-private-signing'
          base.mkdir(mode=0o700,exist_ok=True)
          for env,name in [('KEYSTORE_BASE64','release.jks'),('LINEAGE_BASE64','lineage.bin')]:
              data=base64.b64decode(os.environ[env],validate=True)
              assert data, 'Missing private signing configuration'
              path=base/name
              path.write_bytes(data)
              path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('LIGHTFRAME_SIGNING_KEYSTORE='+str(base/'release.jks')+'\n')
              out.write('LIGHTFRAME_SIGNING_LINEAGE='+str(base/'lineage.bin')+'\n')
          PY
      - name: 构建正式完整与精简安装包
        env:
          LIGHTFRAME_SIGNING_STORE_PASSWORD: ${{ secrets.LIGHTFRAME_RELEASE_STORE_PASSWORD }}
          LIGHTFRAME_SIGNING_KEY_PASSWORD: ${{ secrets.LIGHTFRAME_RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          python build-local.py
          python scripts/package_source.py
      - name: 发布安装包、源码与校验摘要
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ../dist
          version="${RELEASE_TAG#v}"
          sha256sum "LightFrame-$version-full.apk" "LightFrame-$version-lite.apk" "LightFrame-$version-source.zip" > SHA256SUMS.txt
          printf '%s\n' '轻帧正式版：完整版本含本地性能记录；精简版本仅实时显示，两者可并存。安装包与源码由该版本标签构建，SHA256SUMS.txt 提供校验摘要。应用仅在用户主动检查/下载更新时联网，安装仍需 Android 系统确认。使用说明和验证范围见仓库文档。' > release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "该版本已发布，保留现有安装包与源码。"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "LightFrame-$version-full.apk" "LightFrame-$version-lite.apk" "LightFrame-$version-source.zip" SHA256SUMS.txt --verify-tag --title "LightFrame $RELEASE_TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY" --latest=true

      - name: 清理临时签名材料
        if: always()
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          target=root/'lightframe-private-signing'
          if target.is_dir() and target.resolve().is_relative_to(root):
              shutil.rmtree(target)
          PY
